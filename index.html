<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laís Melo · portfólio UGC</title>
<meta name="description" content="UGC creator em Goiânia. Vídeos naturais e estratégicos que mostram seu produto na vida real.">
<!-- Prévia do link no WhatsApp (endereço do GitHub Pages) -->
<meta property="og:title" content="Laís Melo · UGC creator">
<meta property="og:description" content="Crio vídeos naturais e criativos que mostram como seu produto funciona na vida real e fazem as pessoas quererem conhecer sua marca.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://laismeloaraujo-ui.github.io/">
<meta property="og:image" content="https://laismeloaraujo-ui.github.io/midia/capa.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#A9C7E8; --azul-claro:#E3EDF7; --manteiga:#F5E6A8; --manteiga-claro:#FAF3D6;
  --vinho:#702D3D; --off:#F8F5EF; --papel:#FFFDF9; --marinho:#1F2F48; --linha:rgba(112,45,61,.22);
  --serif:"Playfair Display",Georgia,serif; --italico:"Cormorant Garamond",Georgia,serif;
  --sans:"DM Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:var(--sans);font-size:16px;line-height:1.6;color:var(--marinho);background:var(--off);overflow-x:hidden}
img,video{display:block;max-width:100%}
a{color:inherit}
button{font:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;color:var(--vinho);line-height:1.08;letter-spacing:-.01em}
h2{font-size:clamp(30px,3.6vw,44px)}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}
.sec{padding:96px 0}
.tag{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--vinho)}
.tag::before{content:"";width:28px;height:1px;background:var(--vinho)}
.cabeca{margin-bottom:44px;max-width:640px}
.cabeca h2{margin-top:14px}
.cabeca p{margin-top:14px;color:var(--marinho)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 26px;border:1px solid var(--vinho);font:700 13px var(--sans);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:background .25s,color .25s}
.btn-cheio{background:var(--vinho);color:var(--off)}
.btn-cheio:hover{background:#5c2432}
.btn-linha{background:transparent;color:var(--vinho)}
.btn-linha:hover{background:var(--vinho);color:var(--off)}
.ast{color:var(--vinho);font-family:var(--sans);font-weight:400}
.lacuna{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px;color:var(--vinho);
  background:repeating-linear-gradient(-45deg,var(--manteiga-claro) 0 10px,var(--off) 10px 20px);font-size:13px;line-height:1.4;width:100%;height:100%}
.lacuna svg{width:30px;height:30px}

/* MENU */
/* cor da barra do topo: troque --barra / --barra-texto / --barra-destaque para testar outra combinação */
.menu{--barra:var(--vinho);--barra-texto:var(--off);--barra-destaque:var(--manteiga);position:sticky;top:0;z-index:50;background:var(--barra);color:var(--barra-texto)}
.menu .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:68px}
.logo{font-family:var(--serif);font-size:24px;color:var(--barra-texto);text-decoration:none;white-space:nowrap}
.logo .ast{font-size:16px;margin-left:4px;vertical-align:4px;color:var(--barra-destaque)}
.menu nav{display:flex;gap:26px;align-items:center}
.menu nav a{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--barra-texto);text-decoration:none;opacity:.85}
.menu nav a:hover{opacity:1;color:var(--barra-destaque);text-decoration:underline;text-underline-offset:6px}
.idioma{display:flex;align-items:center;gap:2px;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--barra-texto)}
.idioma button{background:none;border:0;padding:6px 6px;cursor:pointer;color:var(--barra-texto);opacity:.55;letter-spacing:.14em;font-weight:700}
.idioma button[aria-pressed="true"]{opacity:1;color:var(--barra-destaque);text-decoration:underline;text-underline-offset:5px}
.menu-btn{display:none;background:none;border:1px solid var(--barra-texto);padding:7px 14px;font:700 12px var(--sans);letter-spacing:.14em;color:var(--barra-texto);text-transform:uppercase;cursor:pointer}
.menu-mob{display:none}

/* CAPA */
.capa{position:relative;overflow:hidden;padding:72px 0 96px}
.capa::before{content:"";position:absolute;right:0;top:0;bottom:0;width:38%;background:var(--azul-claro);clip-path:polygon(28% 0,100% 0,100% 100%,0 100%)}
.capa .wrap{position:relative;display:grid;grid-template-columns:1.08fr .92fr;gap:56px;align-items:center}
.capa h1{font-size:clamp(54px,7.4vw,104px);margin:20px 0 14px;letter-spacing:-.02em}
.capa .nichos-linha{font-family:var(--serif);font-style:italic;font-size:clamp(19px,2vw,23px);color:var(--vinho);margin-bottom:18px}
.capa .frase{max-width:500px;font-size:16px}
.indicadores{display:flex;gap:0;margin:34px 0 36px;border-top:1px solid var(--linha);border-bottom:1px solid var(--linha);max-width:600px}
.indicador{flex:1;padding:18px 0}
.indicador+.indicador{padding-left:24px;border-left:1px solid var(--linha)}
.indicador b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(34px,3.8vw,50px);line-height:1;color:var(--vinho);white-space:nowrap}
.indicador span{display:block;margin-top:8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--marinho)}
.botoes{display:flex;gap:12px;flex-wrap:wrap}
.capa-foto{position:relative;justify-self:center;width:min(400px,100%)}
.capa-foto::before{content:"";position:absolute;left:-26px;top:26px;width:100%;height:100%;background:var(--manteiga)}
.capa-foto::after{content:"";position:absolute;right:-18px;top:-18px;width:120px;height:120px;background:repeating-linear-gradient(90deg,var(--azul) 0 8px,transparent 8px 16px)}
.capa-foto img{position:relative;z-index:1;width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--vinho)}
.capa-foto .assina{position:absolute;z-index:2;left:-26px;bottom:-22px;background:var(--off);border:1px solid var(--vinho);padding:10px 16px;font-family:var(--italico);font-style:italic;font-size:20px;color:var(--vinho)}

/* SOBRE */
.sobre{background:var(--papel);border-top:1px solid var(--linha)}
.sobre-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:72px;align-items:center}
.galeria{position:relative}
.galeria::before{content:"";position:absolute;inset:24px -24px -24px 24px;background:var(--azul-claro)}
.galeria{max-width:420px;justify-self:center;width:100%}
.gal-palco{position:relative;aspect-ratio:3/4;margin:0 auto;background:var(--off);border:1px solid var(--vinho);overflow:hidden;transition:aspect-ratio .5s ease}
.gal-palco img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease}
.gal-palco img.ativa{opacity:1}
.gal-nav{position:relative;display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.seta{width:44px;height:44px;border-radius:50%;border:1px solid var(--vinho);background:var(--off);color:var(--vinho);font-size:18px;cursor:pointer;display:grid;place-items:center;transition:background .2s,color .2s}
.seta:hover:not(:disabled){background:var(--vinho);color:var(--off)}
.seta:disabled{opacity:.3;cursor:default}
.pontos{display:flex;gap:8px;align-items:center}
.pontos button{width:8px;height:8px;border-radius:50%;border:1px solid var(--vinho);background:transparent;padding:0;cursor:pointer}
.pontos button[aria-current="true"]{background:var(--vinho)}
.contador{font-size:12px;letter-spacing:.16em;font-weight:700;color:var(--vinho);margin-left:10px}
.sobre p.texto{max-width:560px;margin:18px 0 30px}
.diferenciais{list-style:none;border-top:1px solid var(--linha);margin-bottom:28px}
.diferenciais li{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--linha);font-size:15px}
.diferenciais b{font-family:var(--serif);font-weight:400;font-size:24px;color:var(--vinho);line-height:1.1}
.credencial{font-size:13px;letter-spacing:.04em;color:var(--marinho)}
.credencial .ast{margin-right:6px}

/* MARCAS */
.marcas{background:var(--off);padding:56px 0;border-top:1px solid var(--linha);border-bottom:1px solid var(--linha)}
.marcas .tag{display:flex;justify-content:center;margin-bottom:28px}
.marcas .tag::after{content:"";width:28px;height:1px;background:var(--vinho)}
.faixa{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.faixa-trilho{display:flex;gap:28px;width:max-content;animation:rola 70s linear infinite;align-items:center}
.faixa:hover .faixa-trilho{animation-play-state:paused}
.faixa img{height:72px;width:112px;object-fit:contain;background:#fff;border:1px solid rgba(112,45,61,.12);padding:6px}
@keyframes rola{to{transform:translateX(-50%)}}

/* DESTAQUES */
.destaques{display:grid;grid-template-columns:.75fr 1.25fr;min-height:660px}
.dest-texto{background:var(--off);padding:96px 56px 96px max(32px,calc((100vw - 1160px)/2 + 32px));display:flex;flex-direction:column;justify-content:center;gap:16px}
.dest-texto p{max-width:380px}
.dest-texto .btn{align-self:flex-start;margin-top:10px}
.dest-listras{background:repeating-linear-gradient(90deg,var(--azul) 0 28px,var(--manteiga) 28px 56px);padding:72px 32px;display:flex;align-items:center;justify-content:center}
.dest-trilho{display:flex;gap:24px;align-items:center;justify-content:center}
.dest-item{flex:0 0 210px}
.dest-item.forte{flex-basis:262px;order:2}
.dest-item.d2{order:1}.dest-item.d3{order:3}
.moldura{background:var(--papel);padding:8px;border:1px solid var(--vinho)}
.legenda{padding:12px 4px 2px;text-align:center}
.legenda b{display:block;font-family:var(--serif);font-weight:500;font-size:17px;color:var(--vinho);line-height:1.2}
.legenda span{display:block;margin-top:4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--marinho)}
.selo-res{display:inline-block;margin-top:8px;background:var(--vinho);color:var(--off);font-size:12px;font-weight:700;letter-spacing:.08em;padding:4px 10px}

/* VÍDEO */
.vid{position:relative;aspect-ratio:9/16;width:100%;background:var(--azul-claro);cursor:pointer;overflow:hidden}
.vid video{width:100%;height:100%;object-fit:cover}
.vid .play{position:absolute;right:10px;bottom:10px;width:36px;height:36px;border-radius:50%;background:rgba(248,245,239,.94);color:var(--vinho);display:grid;place-items:center;font-size:12px;pointer-events:none}

/* NICHOS */
.nichos{background:var(--azul-claro)}
.atalhos{display:flex;flex-wrap:wrap;gap:10px}
.atalhos a{border:1px solid var(--vinho);padding:8px 16px;font-size:13px;font-weight:500;color:var(--vinho);text-decoration:none;background:var(--papel);transition:background .2s,color .2s}
.atalhos a:hover{background:var(--vinho);color:var(--off)}
.pagina{margin-top:28px;background:var(--papel);border:1px solid var(--linha);padding:32px 34px 28px}
.pag-topo{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--linha)}
.pag-topo h3{font-size:clamp(28px,3.2vw,38px)}
.pag-topo .qtd{margin-top:6px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--marinho)}
.setas{display:flex;gap:10px}
.trilho{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:24px 2px 6px;scrollbar-width:none;cursor:grab}
.trilho::-webkit-scrollbar{display:none}
.trilho.arrastando{scroll-snap-type:none;cursor:grabbing}
.trilho .item{flex:0 0 calc((100% - 60px)/4);scroll-snap-align:start}

/* EQUIPAMENTOS */
.equip{background:var(--manteiga-claro)}
.equip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.equip-card{background:var(--papel);border:1px solid var(--linha);padding:26px 24px;display:flex;align-items:center;gap:18px;transition:border-color .2s}
.equip-card:hover{border-color:var(--vinho)}
.equip-card .icone{flex:0 0 64px;height:64px;border-radius:50%;background:var(--manteiga);display:grid;place-items:center;color:var(--vinho)}
.equip-card .icone svg{width:32px;height:32px}
.equip-card h3{font-size:20px}
.equip-card span{display:block;margin-top:4px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--marinho)}

/* FEEDBACKS */
.feedbacks{background:var(--off);position:relative;overflow:hidden}
.feedbacks::before{content:"";position:absolute;left:0;top:0;bottom:0;width:30%;background:var(--azul-claro);clip-path:polygon(0 0,100% 0,72% 100%,0 100%)}
.feedbacks .wrap{position:relative}
.fb-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:center}
.fb-palco{position:relative;background:var(--papel);border:1px solid var(--vinho);padding:20px;min-height:300px;max-width:520px;display:grid;place-items:center}
.fb-nav{max-width:520px}
.fb-palco img{grid-area:1/1;max-width:100%;max-height:340px;width:auto;height:auto;object-fit:contain;opacity:0;transition:opacity .5s ease;box-shadow:0 8px 24px rgba(31,47,72,.10)}
.fb-palco img.ativa{opacity:1}
.fb-nav{display:flex;align-items:center;justify-content:space-between;margin-top:16px}

/* FAQ */
.faq{background:var(--papel);border-top:1px solid var(--linha)}
.faq-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:start}
.faq-lista{border-top:1px solid var(--vinho)}
.faq details{border-bottom:1px solid var(--linha)}
.faq summary{cursor:pointer;list-style:none;padding:20px 48px 20px 0;font-family:var(--serif);font-size:20px;color:var(--vinho);position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:4px;top:50%;transform:translateY(-50%);font-family:var(--sans);font-size:22px;font-weight:400;transition:transform .25s}
.faq details[open] summary::after{transform:translateY(-50%) rotate(45deg)}
.faq details p{padding:0 0 22px;max-width:640px;font-size:15px}

/* CONTATO */
.contato{display:grid;grid-template-columns:1fr 1fr}
.cont-a{background:var(--azul);padding:96px 56px 96px max(32px,calc((100vw - 1160px)/2 + 32px));display:flex;flex-direction:column;justify-content:center}
.cont-a h2{font-size:clamp(36px,4.6vw,60px);margin:16px 0}
.cont-a p{max-width:420px}
.cont-b{background:var(--off);padding:96px max(32px,calc((100vw - 1160px)/2 + 32px)) 96px 56px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.contato-item{display:block;text-decoration:none;border-bottom:1px solid var(--linha);padding:14px 0 18px;transition:padding .25s}
.contato-item:hover{padding-left:8px}
.contato-item .rot{display:block;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--marinho);margin-bottom:4px}
.contato-item b{font-family:var(--serif);font-weight:500;font-size:clamp(22px,2.4vw,30px);color:var(--vinho);word-break:break-word}
.cont-b .botoes{margin-top:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.form label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--vinho);display:flex;flex-direction:column;gap:6px}
.form input{font:15px var(--sans);padding:12px;border:1px solid var(--vinho);background:#fff;color:var(--marinho)}
.form .cheio{grid-column:1/-1}
.form .ok{grid-column:1/-1;font-family:var(--serif);font-size:22px;color:var(--vinho)}
.rodape{background:var(--manteiga);color:var(--vinho);padding:40px 32px 100px;text-align:center;border-top:1px solid var(--linha)}
.rodape .nome{font-family:var(--serif);font-size:26px}
.rodape small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-top:6px;color:var(--marinho)}
.rodape .assina{font-family:var(--italico);font-style:italic;font-size:22px;margin-top:10px}

/* ZAP FIXO */
.zap{position:fixed;right:18px;bottom:18px;z-index:60;width:52px;height:52px;border-radius:50%;background:var(--vinho);color:var(--off);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.zap svg{width:26px;height:26px}

/* PLAYER */
.player{position:fixed;inset:0;z-index:100;background:rgba(31,47,72,.88);display:none;align-items:center;justify-content:center;padding:20px}
.player.aberto{display:flex}
.player video{max-height:88vh;max-width:min(92vw,500px);aspect-ratio:9/16;background:#000}
.player button{position:absolute;top:16px;right:16px;width:46px;height:46px;border-radius:50%;border:0;background:var(--off);color:var(--vinho);font-size:20px;cursor:pointer}

/* TABLET */
@media (max-width:960px){
  .menu nav{display:none}
  .menu-btn{display:block}
  .menu .wrap{gap:12px}
  .menu-mob.aberto{display:flex;flex-direction:column;gap:16px;padding:16px 32px 24px;border-top:1px solid rgba(248,245,239,.25)}
  .menu-mob a{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--barra-texto);text-decoration:none}
  .capa .wrap,.sobre-grid,.destaques,.fb-grid,.faq-grid,.contato{grid-template-columns:1fr}
  .capa::before{width:100%;top:auto;height:44%;clip-path:polygon(0 22%,100% 0,100% 100%,0 100%)}
  .capa-foto{margin-top:20px}
  .sobre-grid{gap:56px}
  .galeria{max-width:460px}
  .destaques>*{min-width:0}
  .dest-texto,.cont-a,.cont-b{padding:72px 32px}
  .dest-listras{padding:40px 0;display:block}
  .dest-trilho{justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 32px 20px;scrollbar-width:none}
  .dest-item,.dest-item.forte{flex:0 0 250px;scroll-snap-align:center;order:0}
  .trilho .item{flex-basis:calc((100% - 20px)/2)}
  .equip-grid{grid-template-columns:repeat(2,1fr)}
  .feedbacks::before{width:100%;height:30%;clip-path:polygon(0 0,100% 0,100% 40%,0 100%)}
}
/* CELULAR */
@media (max-width:560px){
  .wrap{padding:0 16px}
  .sec{padding:72px 0}
  .menu-mob.aberto{padding:16px}
  .logo{font-size:21px}
  .capa{padding:44px 0 72px}
  .indicador+.indicador{padding-left:12px}
  .indicador b{font-size:27px}
  .indicador span{font-size:11px;letter-spacing:.06em;line-height:1.35}
  .btn{width:100%}
  .capa-foto{width:calc(100% - 30px);margin-left:26px}
  .capa-foto::after{width:80px;height:80px;right:-12px}
  .galeria::before{inset:16px -12px -16px 16px}
  .dest-texto,.cont-a,.cont-b{padding:64px 16px}
  .dest-trilho{padding:10px 16px 20px;gap:16px}
  .dest-item,.dest-item.forte{flex-basis:74%}
  .pagina{padding:24px 16px 20px}
  .trilho .item{flex-basis:76%}
  .equip-grid{grid-template-columns:1fr;gap:12px}
  .equip-card{padding:18px 16px}
  .equip-card .icone{flex-basis:56px;height:56px}
  .equip-card h3{font-size:18px}
  .fb-palco{padding:14px;min-height:300px}
  .form{grid-template-columns:1fr}
  .faq summary{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
  .faixa-trilho{flex-wrap:wrap;width:auto;justify-content:center;padding:0 16px}
}
</style>
</head>
<body>

<header class="menu" id="topo">
  <div class="wrap">
    <a class="logo" href="#topo" id="logo"></a>
    <nav id="navDesk"></nav>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="idioma" role="group" aria-label="Idioma / Language"><button type="button" data-lang="pt">PT</button><span aria-hidden="true">|</span><button type="button" data-lang="en">EN</button></div>
      <button class="menu-btn" id="menuBtn" aria-expanded="false">Menu</button>
    </div>
  </div>
  <div class="menu-mob" id="menuMob"></div>
</header>

<main>

/* ====== COMPORTAMENTOS: carrosséis, vídeos, formulário ====== */
function carrossel(palcoId, pontosId, contId, attr){
  var fotos=$(palcoId).querySelectorAll("img"), pts=$(pontosId).querySelectorAll("button"), atual=0, n=fotos.length;
  var setas=document.querySelectorAll("["+attr+"]");
  function ir(i){
    atual=(i+n)%n;
    fotos.forEach(function(f,k){f.classList.toggle("ativa",k===atual)});
    pts.forEach(function(p,k){p.setAttribute("aria-current",k===atual)});
    $(contId).textContent=String(atual+1).padStart(2,"0")+" / "+String(n).padStart(2,"0");
    if(palcoId==="galPalco"){ // a moldura acompanha o formato de cada foto
      var im=fotos[atual], aj=function(){if(im.naturalWidth)$(palcoId).style.aspectRatio=im.naturalWidth+" / "+im.naturalHeight};
      if(im.complete) aj(); else im.addEventListener("load",aj,{once:true});
    }
  }
  ir(0);
  setas.forEach(function(b){b.onclick=function(){ir(atual+Number(b.getAttribute(attr)))}});
  pts.forEach(function(p){p.onclick=function(){ir(Number(p.dataset.i))}});
  var x0=null; $(palcoId).addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});
  $(palcoId).addEventListener("touchend",function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)ir(atual+(dx<0?1:-1));x0=null});
}

function ligar(D, linkZap){
  var T=UI[LANG];
  carrossel("galPalco","galPontos","galCont","data-gal");
  carrossel("fbPalco","fbPontos","fbCont","data-fb");

  var f=$("form");
  if(f) f.addEventListener("submit",function(ev){
    ev.preventDefault();
    fetch(D.formspree,{method:"POST",body:new FormData(f),headers:{Accept:"application/json"}})
      .then(function(r){if(!r.ok)throw 0;f.innerHTML='<p class="ok">'+T.form[6]+'</p>'})
      .catch(function(){f.innerHTML='<p class="ok" style="font-size:18px">'+T.form[7]+'</p><a class="btn btn-cheio cheio" href="'+linkZap+'" target="_blank" rel="noopener">'+T.form[8]+'</a>'});
  });

  document.querySelectorAll(".vid").forEach(function(el){
    var v=el.querySelector("video");
    el.addEventListener("click",function(){if(el.dataset.arrastou)return;abrir(el.dataset.src,el.dataset.titulo)});
    if(mouse && !v.hasAttribute("data-auto")){
      el.addEventListener("mouseenter",function(){v.play().catch(function(){})});
      el.addEventListener("mouseleave",function(){v.pause()});
    }
  });
  var auto=document.querySelector("video[data-auto]");
  if(auto && calmo){auto.removeAttribute("autoplay");auto.pause()}
  if(auto && !calmo && "IntersectionObserver" in window){
    new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)auto.play().catch(function(){});else auto.pause()})},{threshold:.4}).observe(auto);
  }

  document.querySelectorAll(".pagina").forEach(function(p){
    var t=p.querySelector(".trilho"), bs=p.querySelectorAll(".setas button");
    function estado(){bs[0].disabled=t.scrollLeft<5;bs[1].disabled=t.scrollLeft+t.clientWidth>=t.scrollWidth-5}
    bs.forEach(function(b){b.onclick=function(){t.scrollBy({left:t.clientWidth*b.dataset.dir,behavior:calmo?"auto":"smooth"})}});
    t.addEventListener("scroll",estado,{passive:true}); estado();
    var x0=0,s0=0,ativo=false,moveu=false;
    t.addEventListener("pointerdown",function(e){if(e.pointerType!=="mouse")return;ativo=true;moveu=false;x0=e.clientX;s0=t.scrollLeft});
    window.addEventListener("pointermove",function(e){if(!ativo)return;var dx=e.clientX-x0;if(Math.abs(dx)>5){moveu=true;t.classList.add("arrastando")}t.scrollLeft=s0-dx});
    window.addEventListener("pointerup",function(){if(!ativo)return;ativo=false;t.classList.remove("arrastando");
      if(moveu){t.querySelectorAll(".vid").forEach(function(v){v.dataset.arrastou=1});setTimeout(function(){t.querySelectorAll(".vid").forEach(function(v){delete v.dataset.arrastou})},50)}});
  });

  $("menuMob").querySelectorAll("a").forEach(function(a){a.onclick=function(){$("menuMob").classList.remove("aberto");$("menuBtn").setAttribute("aria-expanded",false)}});
}

/* PLAYER (fica fora do montar, pra não duplicar) */
var player=$("player"), pv=$("playerVideo");
function abrir(src,titulo){
  pv.src=src; player.classList.add("aberto"); pv.muted=false; pv.play().catch(function(){});
  if(window.umami && typeof window.umami.track==="function"){try{window.umami.track("video-"+slug(titulo))}catch(e){}}
}
function fechar(){player.classList.remove("aberto");pv.pause();pv.removeAttribute("src");pv.load()}
$("fechar").onclick=fechar;
player.addEventListener("click",function(e){if(e.target===player)fechar()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&player.classList.contains("aberto"))fechar()});
$("menuBtn").onclick=function(){var a=$("menuMob").classList.toggle("aberto");this.setAttribute("aria-expanded",a)};

function trocarIdioma(l){
  var y=scrollY; LANG=l; try{localStorage.setItem("lm-idioma",l)}catch(e){}
  montar(DADOS); window.scrollTo({top:y,behavior:"instant"});
}
document.querySelectorAll(".idioma button").forEach(function(b){b.onclick=function(){if(b.dataset.lang!==LANG)trocarIdioma(b.dataset.lang)}});
